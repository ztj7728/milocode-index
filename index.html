<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的主页</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      padding: 50px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      max-width: 500px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin: 10px;
      color: #0066ff;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>你好 👋</h1>

  <p>
    我是小明。<br>
    欢迎来到我的个人主页。
  </p>

  <a href="https://github.com/你的用户名">
    GitHub
  </a>

  <a href="mailto:hello@example.com">
    Email
  </a>

</div>

</body>
</html>
