<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiloCode</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --x: 50%;
      --y: 50%;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(
          circle at var(--x) var(--y),
          rgba(255, 255, 255, 0.055),
          transparent 24%
        ),
        #080808;

      color: #f4f4f4;
      font-family:
        Inter,
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      cursor: default;
    }

    /* 背景网格 */
    .grid {
      position: fixed;
      inset: 0;
      pointer-events: none;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        );

      background-size: 70px 70px;

      mask-image:
        radial-gradient(
          circle at center,
          black 0%,
          transparent 70%
        );

      -webkit-mask-image:
        radial-gradient(
          circle at center,
          black 0%,
          transparent 70%
        );

      opacity: 0.7;
    }

    /* 中央柔光 */
    .glow {
      position: fixed;

      width: 700px;
      height: 700px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.055),
          rgba(255, 255, 255, 0.015) 32%,
          transparent 68%
        );

      filter: blur(20px);

      pointer-events: none;

      animation: breathe 7s ease-in-out infinite;
    }

    /* 很淡的光环 */
    .ring {
      position: fixed;

      left: 50%;
      top: 50%;

      width: 500px;
      height: 500px;

      transform:
        translate(-50%, -50%)
        scale(var(--scale, 1));

      border: 1px solid rgba(255, 255, 255, 0.035);
      border-radius: 50%;

      pointer-events: none;
    }

    .ring.one {
      --scale: 1;
      animation: rotate 28s linear infinite;
    }

    .ring.two {
      --scale: 1.45;
      opacity: 0.5;
      animation: rotateReverse 40s linear infinite;
    }

    .ring::before {
      content: "";

      position: absolute;

      width: 4px;
      height: 4px;

      top: -2px;
      left: 50%;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.8);

      box-shadow:
        0 0 8px rgba(255, 255, 255, 0.5),
        0 0 22px rgba(255, 255, 255, 0.15);
    }

    main {
      position: relative;

      width: 100%;
      height: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      isolation: isolate;
    }

    .hero {
      position: relative;
      text-align: center;

      transform:
        translate(
          calc(var(--mx, 0) * 8px),
          calc(var(--my, 0) * 8px)
        );

      transition: transform 0.3s ease-out;

      z-index: 5;
    }

    .logo {
      position: relative;

      font-size: clamp(4rem, 11vw, 10rem);
      font-weight: 300;

      letter-spacing: -0.065em;

      color: rgba(255, 255, 255, 0.95);

      line-height: 0.9;

      user-select: none;

      animation: reveal 1.6s cubic-bezier(.16, 1, .3, 1) both;
    }

    .logo::after {
      content: "MiloCode";

      position: absolute;
      inset: 0;

      color: transparent;

      background:
        linear-gradient(
          110deg,
          transparent 25%,
          rgba(255, 255, 255, 0.95) 48%,
          transparent 70%
        );

      background-size: 220% 100%;

      -webkit-background-clip: text;
      background-clip: text;

      opacity: 0;

      animation: shine 7s ease-in-out 2s infinite;
    }

    .line {
      width: 0;
      height: 1px;

      margin: 28px auto 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.45),
          transparent
        );

      animation: lineReveal 1.7s cubic-bezier(.16, 1, .3, 1) 0.45s forwards;
    }

    .dot {
      width: 4px;
      height: 4px;

      margin: 18px auto 0;

      background: rgba(255, 255, 255, 0.75);

      border-radius: 50%;

      box-shadow:
        0 0 12px rgba(255, 255, 255, 0.25);

      opacity: 0;

      animation:
        fadeIn 1s ease 1.25s forwards,
        pulse 3s ease-in-out 2s infinite;
    }

    /* 鼠标光点 */
    .cursor-light {
      position: fixed;

      width: 300px;
      height: 300px;

      left: 0;
      top: 0;

      transform: translate(-50%, -50%);

      pointer-events: none;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.035),
          transparent 65%
        );

      filter: blur(10px);

      z-index: 2;
    }

    /* 颗粒感 */
    .noise {
      position: fixed;
      inset: 0;

      pointer-events: none;

      opacity: 0.035;

      z-index: 20;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.9'/%3E%3C/svg%3E");

      background-repeat: repeat;
    }

    /* 四角装饰 */
    .corner {
      position: fixed;

      width: 22px;
      height: 22px;

      opacity: 0.16;
    }

    .corner::before,
    .corner::after {
      content: "";
      position: absolute;
      background: #fff;
    }

    .corner::before {
      width: 100%;
      height: 1px;
    }

    .corner::after {
      width: 1px;
      height: 100%;
    }

    .top-left {
      top: 30px;
      left: 30px;
    }

    .top-right {
      top: 30px;
      right: 30px;
      transform: rotate(90deg);
    }

    .bottom-left {
      bottom: 30px;
      left: 30px;
      transform: rotate(-90deg);
    }

    .bottom-right {
      bottom: 30px;
      right: 30px;
      transform: rotate(180deg);
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(30px);
        filter: blur(14px);
        letter-spacing: -0.02em;
      }

      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
        letter-spacing: -0.065em;
      }
    }

    @keyframes lineReveal {
      from {
        width: 0;
        opacity: 0;
      }

      to {
        width: min(300px, 45vw);
        opacity: 1;
      }
    }

    @keyframes shine {
      0%,
      72% {
        opacity: 0;
        background-position: 120% center;
      }

      78% {
        opacity: 0.6;
      }

      90% {
        opacity: 0;
        background-position: -120% center;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes breathe {
      0%,
      100% {
        opacity: 0.55;
        transform: translate(-50%, -50%) scale(0.95);
      }

      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.06);
      }
    }

    @keyframes rotate {
      from {
        transform: translate(-50%, -50%) scale(var(--scale)) rotate(0deg);
      }

      to {
        transform: translate(-50%, -50%) scale(var(--scale)) rotate(360deg);
      }
    }

    @keyframes rotateReverse {
      from {
        transform: translate(-50%, -50%) scale(var(--scale)) rotate(360deg);
      }

      to {
        transform: translate(-50%, -50%) scale(var(--scale)) rotate(0deg);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.35;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    @media (max-width: 768px) {
      .ring {
        width: 300px;
        height: 300px;
      }

      .grid {
        background-size: 45px 45px;
      }

      .corner {
        width: 16px;
        height: 16px;
      }

      .top-left {
        top: 20px;
        left: 20px;
      }

      .top-right {
        top: 20px;
        right: 20px;
      }

      .bottom-left {
        bottom: 20px;
        left: 20px;
      }

      .bottom-right {
        bottom: 20px;
        right: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <div class="grid"></div>
  <div class="glow"></div>

  <div class="ring one"></div>
  <div class="ring two"></div>

  <div class="cursor-light"></div>

  <div class="corner top-left"></div>
  <div class="corner top-right"></div>
  <div class="corner bottom-left"></div>
  <div class="corner bottom-right"></div>

  <main>
    <div class="hero">
      <div class="logo">MiloCode</div>
      <div class="line"></div>
      <div class="dot"></div>
    </div>
  </main>

  <div class="noise"></div>

  <script>
    const root = document.documentElement;
    const hero = document.querySelector(".hero");
    const cursorLight = document.querySelector(".cursor-light");

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    let lightX = mouseX;
    let lightY = mouseY;

    window.addEventListener("mousemove", (event) => {
      mouseX = event.clientX;
      mouseY = event.clientY;

      const xPercent = mouseX / window.innerWidth;
      const yPercent = mouseY / window.innerHeight;

      root.style.setProperty("--x", `${xPercent * 100}%`);
      root.style.setProperty("--y", `${yPercent * 100}%`);

      root.style.setProperty("--mx", xPercent - 0.5);
      root.style.setProperty("--my", yPercent - 0.5);
    });

    function animate() {
      lightX += (mouseX - lightX) * 0.07;
      lightY += (mouseY - lightY) * 0.07;

      cursorLight.style.left = `${lightX}px`;
      cursorLight.style.top = `${lightY}px`;

      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
